packages:
  - "apps/*"
  - "packages/*"
  - "e2b/jobs"

# Allow the native binaries wrangler needs for local dev.
onlyBuiltDependencies:
  - esbuild
  - workerd

# A dependency published less than 7 days ago can't be installed (minutes), so a hijacked release has time to be caught.
minimumReleaseAge: 10080
