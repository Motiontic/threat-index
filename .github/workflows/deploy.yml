# Deploys the Workers with `wrangler`. The data pipeline itself never runs here: it runs on
# Cloudflare and E2B.
#   staging:    every push to main, once CI has passed on that commit.
#   production: a v* tag, or a manual run from main, and only after a reviewer approves the
#               `production` environment.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.TI_API_URL_STAGING }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TI_SETTINGS_KV_ID_STAGING: ${{ secrets.TI_SETTINGS_KV_ID_STAGING }}
      TI_API_URL_STAGING: ${{ vars.TI_API_URL_STAGING }}
      TI_APP_URL_STAGING: ${{ vars.TI_APP_URL_STAGING }}
      TI_CLERK_PUBLISHABLE_KEY_STAGING: ${{ vars.TI_CLERK_PUBLISHABLE_KEY_STAGING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:staging

  production:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.TI_API_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TI_SETTINGS_KV_ID: ${{ secrets.TI_SETTINGS_KV_ID }}
      TI_API_URL: ${{ vars.TI_API_URL }}
      TI_OPS_EMAIL: ${{ vars.TI_OPS_EMAIL }}
      TI_OPS_EMAIL_FROM: ${{ vars.TI_OPS_EMAIL_FROM }}
      TI_APP_URL: ${{ vars.TI_APP_URL }}
      TI_CLERK_PUBLISHABLE_KEY: ${{ vars.TI_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:production
