version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      clerk:
        patterns: ["@clerk/*", "@hono/clerk-auth"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
